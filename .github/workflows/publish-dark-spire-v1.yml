name: Publish Dark Spire Korean v1.0

on:
  push:
    branches: [main]
    paths:
      - "release-build/dark-spire/v1.0/parts/**"
      - ".github/workflows/publish-dark-spire-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble archive from exact Git blobs
        shell: bash
        run: |
          set -euo pipefail
          dir='release-build/dark-spire/v1.0/parts'
          test "$(find "$dir" -maxdepth 1 -name 'part_*.bin' -type f | wc -l)" -eq 9
          cat "$dir"/part_{00..08}.bin > /tmp/DarkSpire_Korean_v1.0_PATCH.zip
          echo 'b903abbbd28ea2be0a92605d16bb7a02734dae5926c7c31e7b5744ec4c642028  /tmp/DarkSpire_Korean_v1.0_PATCH.zip' | sha256sum -c -
          test "$(stat -c %s /tmp/DarkSpire_Korean_v1.0_PATCH.zip)" -eq 5044506
          unzip -t /tmp/DarkSpire_Korean_v1.0_PATCH.zip
          test "$(unzip -Z1 /tmp/DarkSpire_Korean_v1.0_PATCH.zip | wc -l)" -eq 6
          for name in DarkSpire_Korean_Patcher.exe DarkSpire_USA_to_Korean_v1.0.bps PATCH.bat README_KO.txt SHA256SUMS.txt 배포문_KO.txt; do
            unzip -Z1 /tmp/DarkSpire_Korean_v1.0_PATCH.zip | grep -Fx -- "$name"
          done
          unzip -p /tmp/DarkSpire_Korean_v1.0_PATCH.zip DarkSpire_USA_to_Korean_v1.0.bps | sha256sum | grep -Fx '7477b6fd76388793001933ce7e57a7cf56f78cff87fd83bda098f2f57a47b9dc  -'
          if unzip -Z1 /tmp/DarkSpire_Korean_v1.0_PATCH.zip | grep -Eiq '\.(nds|3ds|cia|sav|bin|iso)$'; then
            echo "Refusing to publish game images or save states"
            exit 1
          fi
      - name: Create verified GitHub Release (do not overwrite)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='dark-spire-korean--v1.0'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to silently replace"
            exit 1
          fi
          gh release create "$tag" /tmp/DarkSpire_Korean_v1.0_PATCH.zip \
            --target main \
            --title '다크 스파이어 한국어 패치 v1.0' \
            --notes-file downloads/dark-spire-korean/v1.0/RELEASE_NOTES_KO.md
      - name: Activate catalog and landing page only after publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path("README.md")
          text=path.read_text(encoding="utf-8")
          old="| 다크 스파이어 한국어 패치 | 닌텐도 DS | v1.0 (파일 업로드 대기) | — | [안내](downloads/dark-spire-korean/v1.0/README.md) |"
          new="| 다크 스파이어 한국어 패치 | 닌텐도 DS | v1.0 | 2026-11-09 | [다운로드](https://github.com/JayerSolhan/retro-game-patches/releases/tag/dark-spire-korean--v1.0) |"
          assert text.count(old)==1, "Unexpected catalog state"
          path.write_text(text.replace(old,new),encoding="utf-8")
          landing=Path("downloads/dark-spire-korean/v1.0/README.md")
          t=landing.read_text(encoding="utf-8")
          old_notice="**현재 저장소의 ZIP 바이너리가 아직 업로드되지 않았습니다.** 이 문서의 게시를 릴리스 파일 업로드나 다운로드 성공으로 해석하지 마세요."
          new_notice="**정식 v1.0 릴리스가 생성됐습니다.** 아래 GitHub Releases 링크에서 배포 ZIP을 받으세요."
          assert t.count(old_notice)==1, "Unexpected download-page state"
          t=t.replace(old_notice,new_notice)
          t=t.replace("(정확한 파일 크기는 ZIP 업로드 후 확인)","(5,044,506바이트)")
          t=t.replace("**이 링크는 릴리스 생성 전에는 아직 열리지 않습니다.**","")
          landing.write_text(t,encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md downloads/dark-spire-korean/v1.0/README.md
          git commit -m "docs: activate verified Dark Spire Korean v1.0 release link"
          git push origin HEAD:main
